[project]
name = "capstone-nps"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.38,<2.1", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "python-pptx>=1.0.2,<2", "python-docx>=1.1.2,<2", "openpyxl>=3.1.5,<4",
  "pypdf>=5.3,<7", "pdfplumber>=0.11,<1", "defusedxml>=0.7.1,<1",
  "pillow>=11,<13", "PyYAML>=6,<7", "olefile>=0.47,<1",
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "fakeredis>=2.27,<3", "reportlab>=4.3,<5", "uv>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["docker: requires live Docker stack", "clamav: requires real ClamAV", "media: ffmpeg tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.setuptools.packages.find]
where = ["apps/api"]

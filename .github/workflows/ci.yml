name: prototype-gates
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_media:
        description: 'Explicitly run PPTX/MP4 generation acceptance tests'
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk libreoffice-impress
      - run: pip install -r requirements-dev.lock
      - run: python infra/scripts/bootstrap.py
      - run: ruff check apps/api tests infra/scripts
      - run: pytest --ignore=tests/unit/test_ppt.py --ignore=tests/unit/test_video.py -k 'not golden_review_ppt_video_version_audit' --cov=nps --junitxml=test-results/pytest.xml
      - run: npm ci && npm test && npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=moderate
        working-directory: apps/web
      - run: python infra/scripts/manage.py e2e
        if: github.event_name == 'workflow_dispatch' && inputs.run_media
      - run: python infra/scripts/policy_check.py
      - run: python infra/scripts/bundle.py --development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-test-results
          path: test-results/

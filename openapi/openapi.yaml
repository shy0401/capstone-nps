    ContentBlock:
      properties:
        type:
          type: string
          enum:
          - text
          - table
          - chart
          - image
          title: Type
          default: text
        text:
          type: string
          maxLength: 600
          title: Text
          default: ''
        cells:
          items:
            items:
              type: string
            type: array
          type: array
          maxItems: 12
          title: Cells
        source_refs:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          minItems: 1
          title: Source Refs
      additionalProperties: false
      type: object
      required:
      - source_refs
      title: ContentBlock
    Evidence:
      properties:
        document_version_id:
          type: string
          format: uuid
          title: Document Version Id
        chunk_id:
          type: string
          format: uuid
          title: Chunk Id
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        section:
          type: string
          title: Section
        node_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Node Ids
      additionalProperties: false
      type: object
      required:
      - document_version_id
      - chunk_id
      - section
      title: Evidence
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Login:
      properties:
        username:
          type: string
          maxLength: 80
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 200
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: Login
    MemberInput:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role:
          $ref: '#/components/schemas/Role'
          default: User
      additionalProperties: false
      type: object
      required:
      - user_id
      title: MemberInput
    PlannedSlide:
      properties:
        slide_id:
          type: string
          format: uuid
          title: Slide Id
        version:
          type: integer
          title: Version
          default: 1
        order:
          type: integer
          minimum: 1.0
          title: Order
        layout_type:
          type: string
          enum:
          - title_content
          - table
          - chart
          - image
          title: Layout Type
          default: title_content
        title:
          type: string
          maxLength: 80
          minLength: 1
          title: Title
        content_blocks:
          items:
            $ref: '#/components/schemas/ContentBlock'
          type: array
          maxItems: 5
          minItems: 1
          title: Content Blocks
        source_refs:
          items:
            $ref: '#/components/schemas/Evidence'
          type: array
          minItems: 1
          title: Source Refs
        visual_plan:
          $ref: '#/components/schemas/VisualPlan'
      additionalProperties: false
      type: object
      required:
      - order
      - title
      - content_blocks
      - source_refs
      title: PlannedSlide
    ProjectInput:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
        security_class:
          type: string
          maxLength: 30
          title: Security Class
          default: synthetic
        template_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Template Id
      additionalProperties: false
      type: object
      required:
      - name
      title: ProjectInput
    RegenerateInput:
      properties:
        slide_id:
          type: string
          format: uuid
          title: Slide Id
      additionalProperties: false
      type: object
      required:
      - slide_id
      title: RegenerateInput
    RetryInput:
      properties:
        resume_from_step:
          anyOf:
          - type: string
          - type: 'null'
          title: Resume From Step
      additionalProperties: false
      type: object
      title: RetryInput
    ReviewInput:
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - request-change
          title: Decision
        comment:
          type: string
          maxLength: 2000
          title: Comment
          default: ''
        version:
          type: integer
          minimum: 1.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - decision
      - version
      title: ReviewInput
    Role:
      type: string
      enum:
      - User
      - Reviewer
      - OrgAdmin
      - SystemAdmin
      title: Role
    RoleInput:
      properties:
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
          title: Active
          default: true
      additionalProperties: false
      type: object
      required:
      - role
      title: RoleInput
    SlidePlanContract:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        plan_id:
          type: string
          format: uuid
          title: Plan Id
        document_versions:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Document Versions
        title:
          type: string
          maxLength: 120
          minLength: 1
          title: Title
        audience:
          type: string
          const: internal
          title: Audience
          default: internal
        slides:
          items:
            $ref: '#/components/schemas/PlannedSlide'
          type: array
          maxItems: 40
          minItems: 1
          title: Slides
        mock:
          type: boolean
          title: Mock
        provenance:
          additionalProperties: true
          type: object
          title: Provenance
      additionalProperties: false
      type: object
      required:
      - document_versions
      - title
      - slides
      - mock
      title: SlidePlanContract
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VisualPlan:
      properties:
        mode:
          type: string
          enum:
          - preserve
          - generate
          - none
          - controlnet
          - ip_adapter
          title: Mode
          default: none
        workflow:
          type: string
          title: Workflow
          default: wf-image-v1
        controlnet:
          anyOf:
          - type: string
            enum:
            - canny
            - depth
          - type: 'null'
          title: Controlnet
        ip_adapter:
          type: boolean
          title: Ip Adapter
          default: false
        seed:
          type: integer
          title: Seed
          default: 42
        prompt:
          type: string
          maxLength: 1000
          title: Prompt
          default: ''
      additionalProperties: false
      type: object
      title: VisualPlan
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

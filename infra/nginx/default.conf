# Docker's embedded DNS updates when Compose recreates the API container.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream nps_api {
  zone nps_api 64k;
  server api:8000 resolve;
}
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 101m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://nps_api; proxy_set_header X-Forwarded-Proto $scheme; proxy_request_buffering off; }
  location /ws/ {
    proxy_pass http://nps_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
